---
# vim: set ft=ansible

# Showroom Cluster Admin Setup (adapted from Homeroom version)
# Keeps all cluster metadata gathering, swaps deployment for Showroom

- name: create the variable template file
  template:
    src: files/workshop-settings.j2
    dest: /tmp/workshop-settings.sh

# Wait for Showroom to be deployed (by ocp4_workload_showroom)
# Using namespace-based lookup instead of label selectors (more reliable)
- name: Set Showroom namespace
  set_fact:
    showroom_namespace: "showroom-{{ guid }}"

- name: Wait for Showroom deployment to exist
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: "{{ showroom_namespace }}"
  register: showroom_deployment_r
  until: showroom_deployment_r.resources | length > 0
  retries: 10
  delay: 10

- name: Read workshop settings file from bastion
  slurp:
    src: /tmp/workshop-settings.sh
  register: workshop_settings_content

- name: Create ConfigMap with workshop environment variables
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: workshop-env
        namespace: "{{ showroom_namespace }}"
        labels:
          app: showroom
      data:
        workshop-settings.sh: "{{ workshop_settings_content.content | b64decode }}"

- name: Parse workshop settings into individual variables for ConfigMap
  set_fact:
    workshop_vars: >-
      {%- set result = {} -%}
      {%- for key, value in workshop_settings_content.content | b64decode | regex_findall('([A-Z_]+)=(.*)') -%}
      {%- set _ = result.update({key: value}) -%}
      {%- endfor -%}
      {{ result }}

- name: Create ConfigMap with individual environment variables
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: workshop-vars
        namespace: "{{ showroom_namespace }}"
        labels:
          app: showroom
      data: "{{ workshop_vars }}"

- name: Patch Showroom deployment to inject workshop environment variables
  shell: |
    oc patch deployment showroom -n {{ showroom_namespace }} --type=json -p='[
      {
        "op": "add",
        "path": "/spec/template/spec/containers/0/envFrom",
        "value": [
          {
            "configMapRef": {
              "name": "workshop-vars"
            }
          }
        ]
      },
      {
        "op": "add",
        "path": "/spec/template/spec/containers/1/envFrom",
        "value": [
          {
            "configMapRef": {
              "name": "workshop-vars"
            }
          }
        ]
      }
    ]'
  register: patch_result
  failed_when: patch_result.rc != 0 and 'already exists' not in patch_result.stderr

- name: Wait for Showroom deployment to roll out with new environment variables
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: "{{ showroom_namespace }}"
    name: showroom
  register: showroom_deployment_patched
  until:
    - showroom_deployment_patched.resources[0].status.updatedReplicas is defined
    - showroom_deployment_patched.resources[0].status.updatedReplicas == showroom_deployment_patched.resources[0].spec.replicas
  retries: 30
  delay: 10

# ==============================================================================
# Auto-install CLI tools via .workshop/setup script
# To disable: set enable_workshop_cli_tools: false in your vars
# ==============================================================================
- name: Patch terminal container to mount workshop content for CLI tool installation
  shell: |
    oc patch deployment showroom -n {{ showroom_namespace }} --type=json -p='[
      {
        "op": "add",
        "path": "/spec/template/spec/containers/2/volumeMounts/-",
        "value": {
          "name": "showroom",
          "mountPath": "/showroom",
          "readOnly": true
        }
      }
    ]'
  register: terminal_mount_result
  failed_when: terminal_mount_result.rc != 0 and 'already exists' not in terminal_mount_result.stderr
  when: enable_workshop_cli_tools | default(true) | bool

- name: Wait for Showroom deployment to roll out after mounting workshop content
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: "{{ showroom_namespace }}"
    name: showroom
  register: showroom_deployment_after_mount
  until:
    - showroom_deployment_after_mount.resources[0].status.updatedReplicas is defined
    - showroom_deployment_after_mount.resources[0].status.updatedReplicas == showroom_deployment_after_mount.resources[0].spec.replicas
    - showroom_deployment_after_mount.resources[0].status.readyReplicas is defined
    - showroom_deployment_after_mount.resources[0].status.readyReplicas == showroom_deployment_after_mount.resources[0].spec.replicas
  retries: 30
  delay: 10
  when: enable_workshop_cli_tools | default(true) | bool

- name: Wait for Showroom pod to be fully ready
  shell: |
    oc wait --for=condition=ready pod -l app=showroom -n {{ showroom_namespace }} --timeout=300s
  when: enable_workshop_cli_tools | default(true) | bool

- name: Create bashrc.d directory in terminal container
  shell: |
    oc exec deployment/showroom -n {{ showroom_namespace }} -c terminal -- mkdir -p /home/lab-user/.bashrc.d
  register: bashrc_dir_result
  failed_when: bashrc_dir_result.rc != 0 and 'File exists' not in bashrc_dir_result.stderr
  when: enable_workshop_cli_tools | default(true) | bool

- name: Add workshop setup auto-run script to terminal
  shell: |
    oc exec deployment/showroom -n {{ showroom_namespace }} -c terminal -- bash -c 'cat > /home/lab-user/.bashrc.d/00-workshop-setup.sh << "EOF"
    #!/bin/bash
    # Auto-run .workshop/setup script on first terminal login
    if [ -x /showroom/repo/.workshop/setup ] && [ ! -f ~/.workshop-setup-complete ]; then
      echo "Running workshop CLI tools setup..."
      /showroom/repo/.workshop/setup
      touch ~/.workshop-setup-complete
    fi
    EOF'
  when: enable_workshop_cli_tools | default(true) | bool

- name: Make workshop setup script executable
  shell: |
    oc exec deployment/showroom -n {{ showroom_namespace }} -c terminal -- chmod +x /home/lab-user/.bashrc.d/00-workshop-setup.sh
  when: enable_workshop_cli_tools | default(true) | bool
# ==============================================================================
# End CLI tools auto-install section
# ==============================================================================

- name: Grant cluster-admin to Showroom serviceaccount
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: "showroom-cluster-admin-{{ guid }}"
        labels:
          app: showroom
          guid: "{{ guid }}"
      subjects:
      - kind: ServiceAccount
        name: showroom
        namespace: "{{ showroom_namespace }}"
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: cluster-admin
  register: clusterrolebinding

- name: Fetch Showroom route
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    name: showroom
    namespace: "{{ showroom_namespace }}"
  register: Route

- name: Provide workshop information
  agnosticd_user_info:
    msg: "{{ item }}"
  loop:
  - ""
  - "Access the workshop at https://{{ Route.resources[0].spec.host }}"
  - "Workshop has cluster-admin permissions enabled"
  - "Environment variables available in ConfigMap: workshop-env"
  - ""
  - "Cluster Information:"
  - "  API URL: {{ api_url }}"
  - "  Console: {{ master_url }}"
  - "  Kubeadmin Password: {{ kubeadmin_password }}"
  - ""

# Leave this as the last task in the playbook.

- name: workload tasks complete
  debug:
    msg: "Workload Tasks completed successfully."
  when: not silent | bool
