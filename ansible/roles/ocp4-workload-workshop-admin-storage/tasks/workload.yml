---
# vim: set ft=ansible

# Showroom Cluster Admin Setup (adapted from Homeroom version)
# Keeps all cluster metadata gathering, swaps deployment for Showroom

# ==============================================================================
# LVMS Deployment Section (optional - enabled via workshop_deploy_lvms: true)
# Deploys LVMS operator with optionalPaths for AWS NVMe device handling
# ==============================================================================

- name: Create openshift-storage namespace for LVMS
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ workshop_lvms_namespace }}"
        labels:
          openshift.io/cluster-monitoring: "true"
  when: workshop_deploy_lvms | default(false) | bool

- name: Create CatalogSource for LVMS (snapshot)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operators.coreos.com/v1alpha1
      kind: CatalogSource
      metadata:
        name: "{{ workshop_lvms_catalogsource_name }}"
        namespace: openshift-marketplace
      spec:
        sourceType: grpc
        image: "{{ workshop_lvms_catalog_snapshot_image }}:{{ workshop_lvms_catalog_snapshot_image_tag }}"
        displayName: LVMS Catalog Snapshot
  when:
    - workshop_deploy_lvms | default(false) | bool
    - workshop_lvms_use_catalog_snapshot | default(false) | bool

- name: Create OperatorGroup for LVMS
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operators.coreos.com/v1
      kind: OperatorGroup
      metadata:
        name: lvms-operatorgroup
        namespace: "{{ workshop_lvms_namespace }}"
      spec:
        targetNamespaces:
          - "{{ workshop_lvms_namespace }}"
  when: workshop_deploy_lvms | default(false) | bool

- name: Create LVMS Subscription
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operators.coreos.com/v1alpha1
      kind: Subscription
      metadata:
        name: lvms-operator
        namespace: "{{ workshop_lvms_namespace }}"
      spec:
        channel: "{{ workshop_lvms_channel }}"
        installPlanApproval: Automatic
        name: lvms-operator
        source: "{{ workshop_lvms_use_catalog_snapshot | default(false) | ternary(workshop_lvms_catalogsource_name, 'redhat-operators') }}"
        sourceNamespace: openshift-marketplace
  when: workshop_deploy_lvms | default(false) | bool

- name: Wait for LVMS Subscription to have installedCSV
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: Subscription
    name: lvms-operator
    namespace: "{{ workshop_lvms_namespace }}"
  register: lvms_subscription
  until:
    - lvms_subscription.resources | length > 0
    - lvms_subscription.resources[0].status is defined
    - lvms_subscription.resources[0].status.installedCSV is defined
    - lvms_subscription.resources[0].status.installedCSV | length > 0
  retries: 60
  delay: 10
  when: workshop_deploy_lvms | default(false) | bool

- name: Wait for LVMS CSV to be Succeeded
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    name: "{{ lvms_subscription.resources[0].status.installedCSV }}"
    namespace: "{{ workshop_lvms_namespace }}"
  register: lvms_csv
  until:
    - lvms_csv.resources | length > 0
    - lvms_csv.resources[0].status is defined
    - lvms_csv.resources[0].status.phase is defined
    - lvms_csv.resources[0].status.phase == "Succeeded"
  retries: 60
  delay: 10
  when: workshop_deploy_lvms | default(false) | bool

- name: Create LVMCluster with optionalPaths
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: lvm.topolvm.io/v1alpha1
      kind: LVMCluster
      metadata:
        name: lvmcluster
        namespace: "{{ workshop_lvms_namespace }}"
      spec:
        storage:
          deviceClasses:
            - name: "{{ workshop_lvms_vg_name }}"
              default: true
              deviceSelector: "{{ lookup('template', 'lvms_device_selector.j2') | from_yaml }}"
              thinPoolConfig:
                name: thin-pool-1
                sizePercent: 90
                overprovisionRatio: 10
  when: workshop_deploy_lvms | default(false) | bool

- name: Wait for LVMCluster to be ready
  kubernetes.core.k8s_info:
    api_version: lvm.topolvm.io/v1alpha1
    kind: LVMCluster
    name: lvmcluster
    namespace: "{{ workshop_lvms_namespace }}"
  register: lvmcluster_status
  until:
    - lvmcluster_status.resources | length > 0
    - lvmcluster_status.resources[0].status is defined
    - lvmcluster_status.resources[0].status.state is defined
    - lvmcluster_status.resources[0].status.state == "Ready"
  retries: 60
  delay: 10
  when: workshop_deploy_lvms | default(false) | bool

- name: Display LVMS deployment status
  debug:
    msg: "LVMS deployed successfully with LVMCluster in Ready state"
  when: workshop_deploy_lvms | default(false) | bool

# ==============================================================================
# End LVMS Deployment Section
# ==============================================================================

- name: create the variable template file
  template:
    src: files/workshop-settings.j2
    dest: /tmp/workshop-settings.sh

# Wait for Showroom to be deployed (by ocp4_workload_showroom)
# Using namespace-based lookup instead of label selectors (more reliable)
- name: Set Showroom namespace
  set_fact:
    showroom_namespace: "showroom-{{ guid }}"

- name: Wait for Showroom deployment to exist
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: "{{ showroom_namespace }}"
  register: showroom_deployment_r
  until: showroom_deployment_r.resources | length > 0
  retries: 10
  delay: 10

- name: Read workshop settings file from bastion
  slurp:
    src: /tmp/workshop-settings.sh
  register: workshop_settings_content

- name: Create ConfigMap with workshop environment variables
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: workshop-env
        namespace: "{{ showroom_namespace }}"
        labels:
          app: showroom
      data:
        workshop-settings.sh: "{{ workshop_settings_content.content | b64decode }}"

- name: Parse workshop settings into individual variables for ConfigMap
  set_fact:
    workshop_vars: >-
      {%- set result = {} -%}
      {%- for key, value in workshop_settings_content.content | b64decode | regex_findall('([A-Z_]+)=(.*)') -%}
      {%- set _ = result.update({key: value}) -%}
      {%- endfor -%}
      {{ result }}

- name: Create ConfigMap with individual environment variables
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: workshop-vars
        namespace: "{{ showroom_namespace }}"
        labels:
          app: showroom
      data: "{{ workshop_vars }}"

- name: Patch Showroom deployment to inject workshop environment variables
  shell: |
    oc patch deployment showroom -n {{ showroom_namespace }} --type=json -p='[
      {
        "op": "add",
        "path": "/spec/template/spec/containers/0/envFrom",
        "value": [
          {
            "configMapRef": {
              "name": "workshop-vars"
            }
          }
        ]
      },
      {
        "op": "add",
        "path": "/spec/template/spec/containers/1/envFrom",
        "value": [
          {
            "configMapRef": {
              "name": "workshop-vars"
            }
          }
        ]
      }
    ]'
  register: patch_result
  failed_when: patch_result.rc != 0 and 'already exists' not in patch_result.stderr

- name: Wait for Showroom deployment to roll out with new environment variables
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: "{{ showroom_namespace }}"
    name: showroom
  register: showroom_deployment_patched
  until:
    - showroom_deployment_patched.resources[0].status.updatedReplicas is defined
    - showroom_deployment_patched.resources[0].status.updatedReplicas == showroom_deployment_patched.resources[0].spec.replicas
  retries: 30
  delay: 10

# ==============================================================================
# Auto-install CLI tools via .workshop/setup script
# To disable: set enable_workshop_cli_tools: false in your vars
# ==============================================================================
- name: Patch terminal container to mount workshop content for CLI tool installation
  shell: |
    oc patch deployment showroom -n {{ showroom_namespace }} --type=json -p='[
      {
        "op": "add",
        "path": "/spec/template/spec/containers/2/volumeMounts/-",
        "value": {
          "name": "showroom",
          "mountPath": "/showroom",
          "readOnly": true
        }
      }
    ]'
  register: terminal_mount_result
  failed_when: terminal_mount_result.rc != 0 and 'already exists' not in terminal_mount_result.stderr
  when: enable_workshop_cli_tools | default(true) | bool

- name: Wait for Showroom deployment to roll out after mounting workshop content
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: "{{ showroom_namespace }}"
    name: showroom
  register: showroom_deployment_after_mount
  until:
    - showroom_deployment_after_mount.resources[0].status.updatedReplicas is defined
    - showroom_deployment_after_mount.resources[0].status.updatedReplicas == showroom_deployment_after_mount.resources[0].spec.replicas
    - showroom_deployment_after_mount.resources[0].status.readyReplicas is defined
    - showroom_deployment_after_mount.resources[0].status.readyReplicas == showroom_deployment_after_mount.resources[0].spec.replicas
  retries: 30
  delay: 10
  when: enable_workshop_cli_tools | default(true) | bool

- name: Wait for Showroom pod to be fully ready
  shell: |
    POD_NAME=$(oc get pods -n {{ showroom_namespace }} -o jsonpath='{.items[0].metadata.name}')
    oc wait --for=condition=ready pod/$POD_NAME -n {{ showroom_namespace }} --timeout=300s
  when: enable_workshop_cli_tools | default(true) | bool

- name: Add Antora cache volume to Showroom deployment
  shell: |
    oc patch deployment showroom -n {{ showroom_namespace }} --type='json' -p='[
      {
        "op": "add",
        "path": "/spec/template/spec/volumes/-",
        "value": {
          "name": "antora-cache",
          "emptyDir": {}
        }
      },
      {
        "op": "add",
        "path": "/spec/template/spec/containers/1/volumeMounts/-",
        "value": {
          "name": "antora-cache",
          "mountPath": "/opt/app-root/src/.cache"
        }
      }
    ]'
  register: antora_cache_result
  failed_when: antora_cache_result.rc != 0 and 'already exists' not in antora_cache_result.stderr
  when: enable_workshop_cli_tools | default(true) | bool

- name: Add npm cache volume to Showroom deployment
  shell: |
    oc patch deployment showroom -n {{ showroom_namespace }} --type='json' -p='[
      {
        "op": "add",
        "path": "/spec/template/spec/volumes/-",
        "value": {
          "name": "npm-cache",
          "emptyDir": {}
        }
      },
      {
        "op": "add",
        "path": "/spec/template/spec/containers/1/volumeMounts/-",
        "value": {
          "name": "npm-cache",
          "mountPath": "/opt/app-root/src/.npm"
        }
      }
    ]'
  register: npm_cache_result
  failed_when: npm_cache_result.rc != 0 and 'already exists' not in npm_cache_result.stderr
  when: enable_workshop_cli_tools | default(true) | bool

- name: Wait for Showroom to roll out after cache volumes added
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: "{{ showroom_namespace }}"
    name: showroom
  register: showroom_after_cache
  until:
    - showroom_after_cache.resources[0].status.updatedReplicas is defined
    - showroom_after_cache.resources[0].status.updatedReplicas == showroom_after_cache.resources[0].spec.replicas
    - showroom_after_cache.resources[0].status.readyReplicas is defined
    - showroom_after_cache.resources[0].status.readyReplicas == showroom_after_cache.resources[0].spec.replicas
  retries: 30
  delay: 10
  when: enable_workshop_cli_tools | default(true) | bool

- name: Wait for new pod to be ready after cache volumes
  shell: |
    sleep 10
    POD_NAME=$(oc get pods -n {{ showroom_namespace }} -o jsonpath='{.items[0].metadata.name}')
    oc wait --for=condition=ready pod/$POD_NAME -n {{ showroom_namespace }} --timeout=300s
  when: enable_workshop_cli_tools | default(true) | bool

- name: Inject workshop environment variables into antora.yml
  shell: |
    oc exec deployment/showroom -n {{ showroom_namespace }} -c content -- bash -c '
    if [ -x /showroom/repo/.workshop/inject-env-vars.sh ]; then
      /showroom/repo/.workshop/inject-env-vars.sh
    else
      echo "ERROR: injection script not found or not executable"
      exit 1
    fi'
  register: inject_vars_result
  when: enable_workshop_cli_tools | default(true) | bool

- name: Display variable injection output
  debug:
    msg: "{{ inject_vars_result.stdout_lines }}"
  when: enable_workshop_cli_tools | default(true) | bool

- name: Rebuild Antora site with injected variables
  shell: |
    oc exec deployment/showroom -n {{ showroom_namespace }} -c content -- bash -c '
    cd /showroom/repo && npx antora default-site.yml'
  register: antora_build_result
  when: enable_workshop_cli_tools | default(true) | bool

- name: Display Antora build output
  debug:
    msg: "{{ antora_build_result.stdout_lines | default([]) }}"
  when: enable_workshop_cli_tools | default(true) | bool

- name: Copy built site to served location
  shell: |
    oc exec deployment/showroom -n {{ showroom_namespace }} -c content -- bash -c '
    cp -r /showroom/repo/public/* /showroom/www/'
  register: copy_site_result
  when: enable_workshop_cli_tools | default(true) | bool

- name: Verify workshop variables are rendered
  shell: |
    oc exec deployment/showroom -n {{ showroom_namespace }} -c content -- bash -c '
    echo "=== Variable Rendering Verification ==="
    echo "Environment: $(grep -c "Amazon Web Services" /showroom/www/ocp-admin-storage/main/index.html || echo 0) occurrences"
    echo "SSH Username: $(grep -c "ssh -l.*bastion\." /showroom/www/ocp-admin-storage/main/installation.html || echo 0) occurrences"'
  register: verify_result
  when: enable_workshop_cli_tools | default(true) | bool

- name: Display verification results
  debug:
    msg: "{{ verify_result.stdout_lines }}"
  when: enable_workshop_cli_tools | default(true) | bool

- name: Create bashrc.d directory in terminal container
  shell: |
    oc exec deployment/showroom -n {{ showroom_namespace }} -c terminal -- mkdir -p /home/lab-user/.bashrc.d
  register: bashrc_dir_result
  failed_when: bashrc_dir_result.rc != 0 and 'File exists' not in bashrc_dir_result.stderr
  when: enable_workshop_cli_tools | default(true) | bool

- name: Add workshop setup auto-run script to terminal
  shell: |
    oc exec deployment/showroom -n {{ showroom_namespace }} -c terminal -- bash -c 'cat > /home/lab-user/.bashrc.d/00-workshop-setup.sh << "EOF"
    #!/bin/bash
    # Auto-run .workshop/setup script on first terminal login
    if [ -x /showroom/repo/.workshop/setup ] && [ ! -f ~/.workshop-setup-complete ]; then
      echo "Running workshop CLI tools setup..."
      /showroom/repo/.workshop/setup
      touch ~/.workshop-setup-complete
    fi
    EOF'
  when: enable_workshop_cli_tools | default(true) | bool

- name: Make workshop setup script executable
  shell: |
    oc exec deployment/showroom -n {{ showroom_namespace }} -c terminal -- chmod +x /home/lab-user/.bashrc.d/00-workshop-setup.sh
  when: enable_workshop_cli_tools | default(true) | bool
# ==============================================================================
# End CLI tools auto-install section
# ==============================================================================

- name: Grant cluster-admin to Showroom serviceaccount
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: "showroom-cluster-admin-{{ guid }}"
        labels:
          app: showroom
          guid: "{{ guid }}"
      subjects:
      - kind: ServiceAccount
        name: showroom
        namespace: "{{ showroom_namespace }}"
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: cluster-admin
  register: clusterrolebinding

- name: Fetch Showroom route
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    name: showroom
    namespace: "{{ showroom_namespace }}"
  register: Route

- name: Provide workshop information
  agnosticd_user_info:
    msg: "{{ item }}"
  loop:
  - ""
  - "Access the workshop at https://{{ Route.resources[0].spec.host }}"
  - "Workshop has cluster-admin permissions enabled"
  - "Environment variables available in ConfigMap: workshop-env"
  - ""
  - "Cluster Information:"
  - "  API URL: {{ api_url }}"
  - "  Console: {{ master_url }}"
  - "  Kubeadmin Password: {{ kubeadmin_password }}"
  - ""

# Leave this as the last task in the playbook.

- name: workload tasks complete
  debug:
    msg: "Workload Tasks completed successfully."
  when: not silent | bool
