---
# ==============================================================================
# DEBUG SECTION - Added for troubleshooting (TEMPORARY)
# ==============================================================================
- name: "DEBUG === REDHAT DEVELOPER HUB WORKLOAD START ==="
  debug:
    msg: |
      Starting ocp4_workload_redhat_developer_hub deployment
      This workload sets up: GitLab deps, RHSSO, Templates, Backstage, GitLab Runner, DevSpaces
      Users Count: {{ ocp4_workload_redhat_developer_hub_users_count | default(1) }}
      GitLab Namespace: {{ ocp4_workload_redhat_developer_hub_gitlab_namespace | default('gitlab') }}
      Backstage Namespace: {{ ocp4_workload_redhat_developer_hub_backstage_namespace | default('backstage') }}

- name: DEBUG - Check RHDH prerequisites
  shell: |
    echo "=== GITLAB STATUS (pre-check) ==="
    oc get pods -A 2>/dev/null | grep -i gitlab | head -10 || echo "No GitLab pods"
    echo ""
    echo "=== GITLAB ROUTES ==="
    oc get routes -A 2>/dev/null | grep -i gitlab | head -5 || echo "No GitLab routes"
    echo ""
    echo "=== ARGOCD/GITOPS STATUS ==="
    oc get argocd -A -o wide 2>/dev/null || echo "No ArgoCD instances"
    echo ""
    echo "=== BACKSTAGE NAMESPACE (pre-check) ==="
    oc get ns backstage 2>/dev/null && echo "Namespace exists" || echo "Will be created"
    echo ""
    echo "=== GITLAB RUNNER OPERATOR (pre-check) ==="
    oc get csv -A 2>/dev/null | grep -i gitlab-runner || echo "Not installed yet"
    echo ""
    echo "=== GITLAB RUNNER SUBSCRIPTION (pre-check) ==="
    oc get subscriptions.operators.coreos.com -A 2>/dev/null | grep -i gitlab-runner || echo "No subscription"
    echo ""
    echo "=== CERTIFIED-OPERATORS CATALOG (for GitLab Runner) ==="
    oc get catalogsource certified-operators -n openshift-marketplace -o jsonpath='{.status.connectionState.lastObservedState}' 2>/dev/null || echo "Not found"
    echo ""
    echo ""
    echo "=== DEVSPACES STATUS (pre-check) ==="
    oc get csv -A 2>/dev/null | grep -i devspaces || echo "No DevSpaces CSV"
  register: debug_rhdh_prereq

- name: Display RHDH prerequisites
  debug:
    msg: "{{ debug_rhdh_prereq.stdout_lines }}"
# ==============================================================================
# END DEBUG SECTION
# ==============================================================================

- name: Setting up workload
  ansible.builtin.debug:
    msg: "Setting up GitLab"

- name: Retrieve Ingress config
  kubernetes.core.k8s_info:
    api_version: config.openshift.io/v1
    kind: Ingress
    name: cluster
  register: r_ingress_config

- name: Get OpenShift Apps Domain
  ansible.builtin.set_fact:
    ocp4_workload_redhat_developer_hub_apps_domain: "{{ r_ingress_config.resources[0].spec.domain }}"
    ocp4_workload_redhat_developer_hub_gitlab_host: "gitlab-{{
      ocp4_workload_redhat_developer_hub_gitlab_namespace }}.{{
      r_ingress_config.resources[0].spec.domain }}"
    ocp4_workload_redhat_developer_hub_keycloak_host: "keycloak-{{
      ocp4_workload_redhat_developer_hub_keycloak_namespace }}.{{
      r_ingress_config.resources[0].spec.domain }}"
    ocp4_workload_redhat_developer_hub_backstage_host: "backstage-{{
      ocp4_workload_redhat_developer_hub_backstage_namespace }}.{{
      r_ingress_config.resources[0].spec.domain }}"
    ocp4_workload_redhat_developer_hub_devspaces_host: "devspaces.{{
     r_ingress_config.resources[0].spec.domain }}"
    ocp4_workload_redhat_developer_hub_openshift_redirect_host: "oauth-openshift.{{
     r_ingress_config.resources[0].spec.domain }}"
    ocp4_workload_redhat_developer_hub_openshift_console_host: console-openshift-console.{{
     r_ingress_config.resources[0].spec.domain }}
    ocp4_workload_redhat_developer_hub_quay_host: quay-{{ guid }}.{{
     r_ingress_config.resources[0].spec.domain }}

# DAYS FIX: Deploy Vault directly (was previously handled by bootstrap workload)
- name: Setup Vault for secrets management
  ansible.builtin.include_tasks:
    file: ./setup_vault.yml

- name: Setup Gitlab dependencies
  ansible.builtin.include_tasks:
    file: ./setup_gitlab.yml

# DAYS FIX: Install RHSSO operator (was expected to be pre-installed)
- name: Setup RHSSO Operator
  ansible.builtin.include_tasks:
    file: ./setup_rhsso_operator.yml

- name: Setup RHSSO dependencies
  ansible.builtin.include_tasks:
    file: ./setup_rhsso.yml

- name: Setup Gitlab repo dependencies
  ansible.builtin.include_tasks:
    file: ./setup_templates.yml
  loop: "{{ ocp4_workload_redhat_developer_hub_gitlab_template_locations }}"
  loop_control:
    loop_var: location

# DAYS FIX: Install ArgoCD/GitOps (required for Backstage)
- name: Setup GitOps/ArgoCD
  ansible.builtin.include_tasks:
    file: ./setup_gitops.yml

# DAYS FIX: Install ODF (required for Quay object storage)
- name: Setup OpenShift Data Foundation
  when: not (ocp4_workload_redhat_developer_hub_skip_quay | default(false) | bool)
  ansible.builtin.include_tasks:
    file: ./setup_odf.yml

# DAYS FIX: Install Quay (required for Backstage container registry integration)
- name: Setup Quay Registry
  when: not (ocp4_workload_redhat_developer_hub_skip_quay | default(false) | bool)
  ansible.builtin.include_tasks:
    file: ./setup_quay.yml

- name: Setup Backstage dependencies
  ansible.builtin.include_tasks:
    file: ./setup_backstage.yml

- name: Setup Gitlab dependencies
  ansible.builtin.include_tasks:
    file: ./setup_gitlab_runner.yml

- name: Setup Devspaces dependencies
  ansible.builtin.include_tasks:
    file: ./setup_devspaces.yml

- name: Build user output
  block:
  - name: Set user_list
    ansible.builtin.set_fact:
      user_list: "{{ ocp4_workload_redhat_developer_hub_username_base }}1"
  - name: Update user_list
    when: ocp4_workload_redhat_developer_hub_users_count | int > 1
    ansible.builtin.set_fact:
      user_list: "{{ user_list }}\n{{ ocp4_workload_redhat_developer_hub_username_base }}{{ item + 1 }}"
    loop: "{{ range(1, ocp4_workload_redhat_developer_hub_users_count | int, 1) | list }}"

# DAYS FIX: Replaced agnosticd_user_info with debug (not available outside AgnosticD)
- name: Save user information
  block:
  - name: Save user information for user access
    debug:
      msg: "User: {{ ocp4_workload_redhat_developer_hub_username_base }}{{ n + 1 }}, Password: {{ ocp4_workload_redhat_developer_hub_users_password }}"
    loop: "{{ range(0, ocp4_workload_redhat_developer_hub_users_count | int) | list }}"
    loop_control:
      loop_var: n

- name: Save user data
  debug:
    msg:
      openshift_console_url: "https://{{ ocp4_workload_redhat_developer_hub_openshift_console_host }}"
      openshift_admin_user: "{{ ocp4_workload_redhat_developer_hub_admin_user }}"
      openshift_admin_password: "{{ ocp4_workload_redhat_developer_hub_admin_password }}"
      rhdh_url: "https://{{ ocp4_workload_redhat_developer_hub_backstage_host }}"
      rhdh_id_provider: GitLab
      rhdh_user: "{{ user_list }}"
      rhdh_user_password: "{{ ocp4_workload_redhat_developer_hub_users_password }}"
      gitlab_url: "https://{{ ocp4_workload_redhat_developer_hub_gitlab_host }}"
      gitlab_user: "{{ user_list }}"
      gitlab_user_password: "{{ ocp4_workload_redhat_developer_hub_users_password }}"
      devspaces_url: "https://{{ ocp4_workload_redhat_developer_hub_devspaces_host }}"
      devspaces_user: "{{ user_list }}"
      devspaces_user_password: "{{ ocp4_workload_redhat_developer_hub_users_password }}"

- name: Print Admin credentials
  debug:
    msg: "{{ item }}"
  loop:
  - ""
  - "Your Openshift login credentials:"
  - "Openshift console: https://{{ ocp4_workload_redhat_developer_hub_openshift_console_host }}"
  - "Openshift admin user: {{ ocp4_workload_redhat_developer_hub_admin_user }}"
  - "Openshift admin password: {{ ocp4_workload_redhat_developer_hub_admin_password }}"

- name: Print RH Developer Hub credentials
  debug:
    msg: "{{ item }}"
  loop:
  - ""
  - "Your Backstage login credentials:"
  - "RH Developer Hub: https://{{ ocp4_workload_redhat_developer_hub_backstage_host }}"
  - "RH Developer Hub identity provider: GitLab"
  - "RH Developer Hub user: {{ user_list }}"
  - "RH Developer Hub password: {{ ocp4_workload_redhat_developer_hub_users_password }}"

- name: Print GitLab credentials
  debug:
    msg: "{{ item }}"
  loop:
  - ""
  - "Your GitLab login credentials:"
  - "GitLab: https://{{ ocp4_workload_redhat_developer_hub_gitlab_host }}"
  - "GitLab user: {{ user_list }}"
  - "GitLab password: {{ ocp4_workload_redhat_developer_hub_users_password }}"

- name: Print Devspaces credentials
  debug:
    msg: "{{ item }}"
  loop:
  - ""
  - "Your Devspaces login credentials:"
  - "Devspaces: https://{{ ocp4_workload_redhat_developer_hub_devspaces_host }}"
  - "Devspaces user: {{ user_list }}"
  - "Devspaces password: {{ ocp4_workload_redhat_developer_hub_users_password }}"

# ==============================================================================
# DEBUG SECTION - End of workload verification (TEMPORARY)
# ==============================================================================
- name: "DEBUG === REDHAT DEVELOPER HUB WORKLOAD COMPLETE ==="
  shell: |
    echo "=== BACKSTAGE NAMESPACE ==="
    oc get all -n backstage 2>/dev/null | head -25 || echo "backstage namespace not found"
    echo ""
    echo "=== BACKSTAGE PODS ==="
    oc get pods -n backstage -o wide 2>/dev/null || echo "No pods"
    echo ""
    echo "=== BACKSTAGE ROUTES ==="
    oc get routes -n backstage -o wide 2>/dev/null || echo "No routes"
    echo ""
    echo "=== BACKSTAGE HELM RELEASE ==="
    helm list -n backstage 2>/dev/null || echo "No helm releases"
    echo ""
    echo "=== GITLAB RUNNER OPERATOR ==="
    oc get csv -A 2>/dev/null | grep -i gitlab-runner || echo "No GitLab Runner CSV"
    echo ""
    echo "=== GITLAB RUNNER SUBSCRIPTION STATUS ==="
    oc get subscriptions.operators.coreos.com -A -o json 2>/dev/null | jq -r '.items[] | select(.spec.name | test("gitlab.*runner"; "i")) | "Namespace: \(.metadata.namespace), Channel: \(.spec.channel), Source: \(.spec.source), State: \(.status.state // "unknown")"' 2>/dev/null || echo "No GitLab Runner subscription"
    echo ""
    echo "=== GITLAB RUNNER CRs ==="
    oc get runner -A 2>/dev/null || echo "No Runner CRs"
    echo ""
    echo "=== GITLAB RUNNER PODS ==="
    oc get pods -A 2>/dev/null | grep -i gitlab-runner || echo "No GitLab Runner pods"
    echo ""
    echo "=== DEVSPACES STATUS ==="
    oc get csv -A 2>/dev/null | grep -i devspaces || echo "No DevSpaces CSV"
    echo ""
    echo "=== DEVSPACES CHECLUSTER ==="
    oc get checluster -A 2>/dev/null || echo "No CheCluster"
    echo ""
    echo "=== FINAL GITLAB STATUS ==="
    oc get pods -A 2>/dev/null | grep -i gitlab | head -15 || echo "No GitLab pods"
    echo ""
    echo "=== ALL RHDH-RELATED ROUTES ==="
    oc get routes -A 2>/dev/null | grep -iE "backstage|gitlab|devspaces|argocd" | head -15 || echo "No RHDH routes"
  register: debug_rhdh_complete

- name: Display RHDH completion status
  debug:
    msg: "{{ debug_rhdh_complete.stdout_lines }}"
# ==============================================================================
# END DEBUG SECTION
# ==============================================================================

# Leave this as the last task in the playbook.
# --------------------------------------------
- name: Workload tasks complete
  ansible.builtin.debug:
    msg: "Workload Tasks completed successfully."
  when: not silent|bool
