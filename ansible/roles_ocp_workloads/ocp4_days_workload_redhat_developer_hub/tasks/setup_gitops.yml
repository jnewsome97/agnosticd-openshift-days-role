---
# DAYS FIX: Install OpenShift GitOps operator and create ArgoCD instance
# This makes the RHDH workload self-contained without requiring a separate bootstrap

- name: Check if ArgoCD already exists
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: ArgoCD
    name: argocd
    namespace: janus-argocd
  register: r_argocd_check
  ignore_errors: true

- name: Set argocd_already_installed fact
  ansible.builtin.set_fact:
    argocd_already_installed: "{{ r_argocd_check.resources | default([]) | length > 0 }}"

- name: Display ArgoCD installation status
  debug:
    msg: "ArgoCD already installed: {{ argocd_already_installed }}"

- name: Install OpenShift GitOps and ArgoCD
  when: not argocd_already_installed
  block:
    - name: Install OpenShift GitOps Operator
      ansible.builtin.include_role:
        name: install_operator
      vars:
        install_operator_action: install
        install_operator_name: openshift-gitops-operator
        install_operator_namespace: openshift-operators
        install_operator_channel: latest
        install_operator_catalog: redhat-operators
        install_operator_automatic_install_plan_approval: true
        install_operator_csv_nameprefix: openshift-gitops-operator

    - name: Wait for GitOps CRDs to be available
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: argocds.argoproj.io
      register: r_argocd_crd
      retries: 30
      delay: 10
      until:
        - r_argocd_crd.resources is defined
        - r_argocd_crd.resources | length > 0

    - name: Create janus-argocd namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: janus-argocd

    - name: Create ArgoCD instance
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: argoproj.io/v1alpha1
          kind: ArgoCD
          metadata:
            name: argocd
            namespace: janus-argocd
          spec:
            server:
              insecure: true
              route:
                enabled: true
                tls:
                  termination: edge
                  insecureEdgeTerminationPolicy: Redirect
            dex:
              openShiftOAuth: true
            rbac:
              defaultPolicy: 'role:admin'
              policy: |
                g, system:cluster-admins, role:admin
              scopes: '[groups]'
            resourceExclusions: |
              - apiGroups:
                - tekton.dev
                clusters:
                - '*'
                kinds:
                - TaskRun
                - PipelineRun

- name: Wait for ArgoCD to be ready
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: ArgoCD
    name: argocd
    namespace: janus-argocd
  register: r_argocd
  retries: 60
  delay: 10
  until:
    - r_argocd.resources is defined
    - r_argocd.resources | length > 0
    - r_argocd.resources[0].status is defined
    - r_argocd.resources[0].status.phase is defined
    - r_argocd.resources[0].status.phase == 'Available'

- name: Display ArgoCD status
  debug:
    msg: "ArgoCD is {{ r_argocd.resources[0].status.phase | default('Unknown') }}"
