---
# DAYS FIX: Install RHSSO operator (was expected to be pre-installed by bootstrap)
- name: Install RHSSO Operator
  ansible.builtin.include_role:
    name: install_operator
  vars:
    install_operator_action: install
    install_operator_name: rhsso-operator
    install_operator_namespace: "{{ ocp4_workload_redhat_developer_hub_keycloak_namespace }}"
    install_operator_channel: stable
    install_operator_catalog: redhat-operators
    install_operator_automatic_install_plan_approval: true
    install_operator_csv_nameprefix: rhsso-operator
    install_operator_manage_namespaces:
      - "{{ ocp4_workload_redhat_developer_hub_keycloak_namespace }}"

- name: Wait for RHSSO CRDs to be available
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: keycloakrealms.keycloak.org
  register: r_keycloak_crd
  retries: 30
  delay: 10
  until:
    - r_keycloak_crd.resources is defined
    - r_keycloak_crd.resources | length > 0

- name: Create Keycloak instance
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: keycloak.org/v1alpha1
      kind: Keycloak
      metadata:
        name: keycloak
        namespace: "{{ ocp4_workload_redhat_developer_hub_keycloak_namespace }}"
        labels:
          app: sso
      spec:
        instances: 1
        externalAccess:
          enabled: true

- name: Wait for Keycloak to be ready
  kubernetes.core.k8s_info:
    api_version: keycloak.org/v1alpha1
    kind: Keycloak
    name: keycloak
    namespace: "{{ ocp4_workload_redhat_developer_hub_keycloak_namespace }}"
  register: r_keycloak
  retries: 60
  delay: 10
  until:
    - r_keycloak.resources is defined
    - r_keycloak.resources | length > 0
    - r_keycloak.resources[0].status is defined
    - r_keycloak.resources[0].status.ready is defined
    - r_keycloak.resources[0].status.ready == true
