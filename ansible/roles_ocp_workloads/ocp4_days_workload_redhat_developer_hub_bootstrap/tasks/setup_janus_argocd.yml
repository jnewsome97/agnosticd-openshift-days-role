---
# DAYS FIX: Create ArgoCD directly without relying on the janus-idp-bootstrap helm chart
# The helm chart uses deprecated ArgoCD schema (dex field) that fails with newer GitOps operator

# Check if GitOps operator is already installed by looking for CSVs with gitops in the name
- name: Check if GitOps operator CSV exists
  shell: |
    oc get csv -n openshift-gitops 2>/dev/null | grep -i "openshift-gitops-operator" | grep -i "Succeeded" || true
  register: r_gitops_csv
  ignore_errors: true

- name: Set gitops_installed fact
  ansible.builtin.set_fact:
    gitops_installed: "{{ r_gitops_csv.stdout | length > 0 }}"

- name: Display GitOps operator status
  debug:
    msg: "GitOps operator installed: {{ gitops_installed }}"

# Install GitOps operator if not present
- name: Install GitOps operator
  when: not gitops_installed
  block:
    - name: Create GitOps subscription
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            name: openshift-gitops-operator
            namespace: openshift-operators
          spec:
            channel: latest
            installPlanApproval: Automatic
            name: openshift-gitops-operator
            source: redhat-operators
            sourceNamespace: openshift-marketplace

    - name: Wait for GitOps operator to be ready
      shell: |
        oc get csv -n openshift-gitops 2>/dev/null | grep -i "openshift-gitops-operator" | grep -i "Succeeded"
      register: r_gitops_csv_wait
      retries: 60
      delay: 10
      until: r_gitops_csv_wait.rc == 0

# Check if ArgoCD instance exists in janus-argocd
- name: Check if ArgoCD exists in janus-argocd
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1beta1
    kind: ArgoCD
    name: argocd
    namespace: janus-argocd
  register: r_argocd_check
  ignore_errors: true

- name: Set argocd_exists fact
  ansible.builtin.set_fact:
    argocd_exists: "{{ r_argocd_check.resources | default([]) | length > 0 }}"

- name: Display ArgoCD status
  debug:
    msg: "ArgoCD in janus-argocd exists: {{ argocd_exists }}"

# Create ArgoCD in janus-argocd if not present
- name: Create ArgoCD instance
  when: not argocd_exists
  block:
    - name: Create janus-argocd namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: janus-argocd
            labels:
              argocd.argoproj.io/managed-by: openshift-gitops

    - name: Create ArgoCD instance in janus-argocd
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: argoproj.io/v1beta1
          kind: ArgoCD
          metadata:
            name: argocd
            namespace: janus-argocd
          spec:
            server:
              insecure: true
              route:
                enabled: true
                tls:
                  termination: edge
                  insecureEdgeTerminationPolicy: Redirect
            sso:
              provider: dex
              dex:
                openShiftOAuth: true
            rbac:
              defaultPolicy: 'role:admin'
              policy: |
                g, system:cluster-admins, role:admin
              scopes: '[groups]'
            resourceExclusions: |
              - apiGroups:
                - tekton.dev
                clusters:
                - '*'
                kinds:
                - TaskRun
                - PipelineRun

- name: Wait until ArgoCD is ready
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1beta1
    kind: ArgoCD
    name: argocd
    namespace: janus-argocd
  register: r_argocd_ready
  retries: 60
  delay: 10
  until:
    - r_argocd_ready.resources | length > 0
    - r_argocd_ready.resources[0].status is defined
    - r_argocd_ready.resources[0].status.phase is defined
    - r_argocd_ready.resources[0].status.phase == 'Available'

# Wait for ArgoCD secrets
- name: Wait until ArgoCD secrets are ready
  shell: |
    oc get secret argocd-cluster -n janus-argocd
  register: r_argocd_secrets
  until:
    - r_argocd_secrets is not failed
  retries: 60
  delay: 10

# Reset ArgoCD admin password
- name: Reset ArgoCD password
  shell: |
    oc patch secret argocd-cluster -n janus-argocd \
    -p '{"stringData": {
      "admin.password": "{{ ocp4_workload_redhat_developer_hub_bootstrap_argocd_password }}"
    }}'
  register: r_argocd_update
  until:
    - r_argocd_update is not failed
  retries: 30
  delay: 10

# Create default AppProject if needed
- name: Check if default AppProject exists
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: AppProject
    name: default
    namespace: janus-argocd
  register: r_default_proj
  ignore_errors: true

- name: Create default AppProject
  when: r_default_proj.resources | default([]) | length == 0
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: argoproj.io/v1alpha1
      kind: AppProject
      metadata:
        name: default
        namespace: janus-argocd
      spec:
        clusterResourceWhitelist:
          - group: '*'
            kind: '*'
        destinations:
          - namespace: '*'
            server: '*'
        sourceRepos:
          - '*'

- name: Wait until default project is ready
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: AppProject
    name: default
    namespace: janus-argocd
  register: r_default_proj_ready
  until:
    - r_default_proj_ready is defined
    - r_default_proj_ready.resources is defined
    - r_default_proj_ready.resources | length > 0
  retries: 30
  delay: 10

- name: Display ArgoCD setup complete
  debug:
    msg: "ArgoCD setup complete in janus-argocd namespace"
