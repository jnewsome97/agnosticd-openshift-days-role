---
# ==============================================================================
# DEBUG SECTION - Added for troubleshooting (TEMPORARY)
# ==============================================================================
- name: "DEBUG === MINIO WORKLOAD START ==="
  debug:
    msg: |
      Starting ocp4_workload_minio deployment
      Project: {{ ocp4_workload_minio_project }}
      Storage Size: {{ ocp4_workload_minio_storage_size | default('not set') }}
      Bucket Setup: {{ ocp4_workload_minio_bucket_setup | default(false) }}
      Bucket Names: {{ ocp4_workload_minio_bucket_name | default([]) }}

- name: DEBUG - Check storage class availability
  shell: |
    echo "=== STORAGE CLASSES ==="
    oc get sc
    echo ""
    echo "=== DEFAULT STORAGE CLASS ==="
    oc get sc -o jsonpath='{.items[?(@.metadata.annotations.storageclass\.kubernetes\.io/is-default-class=="true")].metadata.name}'
    echo ""
  register: debug_minio_storage

- name: Display storage class info
  debug:
    msg: "{{ debug_minio_storage.stdout_lines }}"

- name: DEBUG - Check if namespace already exists
  shell: |
    echo "=== NAMESPACE CHECK ==="
    oc get ns {{ ocp4_workload_minio_project }} 2>/dev/null && echo "Namespace exists" || echo "Namespace does not exist (will be created)"
  register: debug_minio_ns

- name: Display namespace check
  debug:
    msg: "{{ debug_minio_ns.stdout_lines }}"
# ==============================================================================
# END DEBUG SECTION
# ==============================================================================

- name: Create OpenShift objects for MinIO object storage
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', item) | from_yaml }}"
  loop:
  - ./templates/namespace.yaml.j2
  - ./templates/secret.yaml.j2
  - ./templates/persistentvolumeclaim.yaml.j2
  - ./templates/deployment.yaml.j2
  - ./templates/service.yaml.j2

- name: Create OpenShift routes for MinIO object storage
  when: ocp4_workload_minio_expose_route | bool
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', item) | from_yaml }}"
  loop:
  - ./templates/route_minio.yaml.j2
  - ./templates/route_console.yaml.j2

- name: Set up a MinIO bucket
  when: ocp4_workload_minio_bucket_setup | bool
  block:
  - name: Wait until MinIO Deployment is running
    kubernetes.core.k8s_info:
      api_version: "apps/v1"
      kind: Deployment
      name: minio
      namespace: "{{ ocp4_workload_minio_project }}"
      wait: true
      wait_sleep: 10
      wait_timeout: 360

  - name: Get MinIO Pod
    kubernetes.core.k8s_info:
      api_version: v1
      kind: Pod
      namespace: "{{ ocp4_workload_minio_project }}"
      label_selectors:
      - app = minio
    register: r_minio_pod

  # Set up MinIO with a bucket
  # POD=$(oc get pod -n minio -lapp=minio -o jsonpath='{range.items[*]}{.metadata.name}{"\n"}{end}')
  # oc -n minio rsh ${POD} mc alias set --insecure localminio localhost:9000 root-user root-user-password
  # oc -n minio rsh ${POD} mc mb localminio/testbucket
  # Validate the bucket exists:
  # oc -n minio rsh ${POD} mc ls localminio

  # `mc` commands can be repeated without failure
  - name: Set up MinIO bucket (Single and Multi-User)
    kubernetes.core.k8s_exec:
      namespace: "{{ ocp4_workload_minio_project }}"
      pod: "{{ r_minio_pod.resources[0].metadata.name }}"
      command: |
        /bin/bash --login -c 'echo "Setting up Minio server..."; \
        mc alias set --insecure \
          {{ ocp4_workload_minio_name }} http://localhost:9000 \
          {{ ocp4_workload_minio_root_user }} {{ ocp4_workload_minio_root_password }}; \

        mc admin policy attach {{ ocp4_workload_minio_name }} \
          {{ ocp4_workload_minio_root_policy }} \
          --user {{ ocp4_workload_minio_root_user }};

        echo "Creating buckets..."; \
        buckets=(); \
        if [ "{{ ocp4_workload_minio_bucket_multi_user }}" == "True" ]; then \
          echo "Multi-User: {{ ocp4_workload_minio_bucket_multi_user }}";  \
          for x in $(seq 1 {{ ocp4_workload_minio_bucket_num_users }}); do \
            buckets+=("{{ ocp4_workload_minio_bucket_base }}{{ ocp4_workload_minio_bucket_userbase }}$x"); \
          done; \
        else \
          echo "Single-User: {{ ocp4_workload_minio_bucket_multi_user }}"; \
          {% for bkt in ocp4_workload_minio_bucket_name %}
          buckets+=("{{ bkt }}"); \
          {% endfor %}
        fi; \
        for bucket in ${buckets[@]}; do \
          mc mb {{ ocp4_workload_minio_name }}/${bucket} --ignore-existing; \
        done'
    register: r_minio_bucket_mu
    until: r_minio_bucket_mu is success
    failed_when: r_minio_bucket_mu.rc != 0

# ==============================================================================
# DEBUG SECTION - End of workload verification (TEMPORARY)
# ==============================================================================
- name: "DEBUG === MINIO WORKLOAD COMPLETE ==="
  shell: |
    echo "=== MINIO NAMESPACE STATUS ==="
    oc get all -n {{ ocp4_workload_minio_project }}
    echo ""
    echo "=== MINIO POD STATUS ==="
    oc get pods -n {{ ocp4_workload_minio_project }} -o wide
    echo ""
    echo "=== MINIO PVC STATUS ==="
    oc get pvc -n {{ ocp4_workload_minio_project }}
    echo ""
    echo "=== MINIO ROUTES ==="
    oc get routes -n {{ ocp4_workload_minio_project }}
    echo ""
    echo "=== MINIO POD LOGS (last 20 lines) ==="
    oc logs -n {{ ocp4_workload_minio_project }} -l app=minio --tail=20 2>/dev/null || echo "No logs available"
  register: debug_minio_complete

- name: Display Minio completion status
  debug:
    msg: "{{ debug_minio_complete.stdout_lines }}"
# ==============================================================================
# END DEBUG SECTION
# ==============================================================================
