---
# DAYS FIX: Install OpenShift GitOps operator and create ArgoCD instance
# This makes the GitOps GitLab workload self-contained

# Check if GitOps operator is already installed
- name: Check if GitOps operator CSV already exists
  shell: |
    oc get csv -A 2>/dev/null | grep -i "openshift-gitops-operator" | grep -i "Succeeded" || true
  register: r_gitops_csv_check
  ignore_errors: true

- name: Check if ArgoCD CRD exists
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: argocds.argoproj.io
  register: r_argocd_crd_check
  ignore_errors: true

- name: Check if ArgoCD already exists in openshift-gitops
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: ArgoCD
    namespace: openshift-gitops
  register: r_argocd_check
  ignore_errors: true
  when: r_argocd_crd_check.resources | default([]) | length > 0

- name: Set installation facts
  ansible.builtin.set_fact:
    gitops_operator_installed: "{{ r_gitops_csv_check.stdout | length > 0 }}"
    argocd_crd_exists: "{{ r_argocd_crd_check.resources | default([]) | length > 0 }}"
    argocd_exists: "{{ (r_argocd_check.resources | default([]) | length > 0) if (r_argocd_crd_check.resources | default([]) | length > 0) else false }}"

- name: Display GitOps installation status
  debug:
    msg: |
      GitOps Operator CSV installed: {{ gitops_operator_installed }}
      ArgoCD CRD exists: {{ argocd_crd_exists }}
      ArgoCD instance exists: {{ argocd_exists }}

# Install GitOps operator only if CSV doesn't exist
- name: Install OpenShift GitOps Operator
  when: not gitops_operator_installed
  block:
    - name: Install GitOps Operator via OLM
      ansible.builtin.include_role:
        name: install_operator
      vars:
        install_operator_action: install
        install_operator_name: openshift-gitops-operator
        install_operator_namespace: openshift-operators
        install_operator_channel: latest
        install_operator_catalog: redhat-operators
        install_operator_automatic_install_plan_approval: true
        install_operator_csv_nameprefix: openshift-gitops-operator

    - name: Wait for GitOps CRDs to be available
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: argocds.argoproj.io
      register: r_argocd_crd
      retries: 30
      delay: 10
      until:
        - r_argocd_crd.resources is defined
        - r_argocd_crd.resources | length > 0

    - name: Wait for openshift-gitops namespace to be created
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Namespace
        name: openshift-gitops
      register: r_gitops_ns
      retries: 30
      delay: 10
      until:
        - r_gitops_ns.resources is defined
        - r_gitops_ns.resources | length > 0

    - name: Wait for default ArgoCD instance in openshift-gitops
      kubernetes.core.k8s_info:
        api_version: argoproj.io/v1alpha1
        kind: ArgoCD
        namespace: openshift-gitops
      register: r_argocd_default
      retries: 60
      delay: 10
      until:
        - r_argocd_default.resources is defined
        - r_argocd_default.resources | length > 0

    - name: Wait for ArgoCD to be Available
      kubernetes.core.k8s_info:
        api_version: argoproj.io/v1alpha1
        kind: ArgoCD
        namespace: openshift-gitops
      register: r_argocd_status
      retries: 60
      delay: 10
      until:
        - r_argocd_status.resources is defined
        - r_argocd_status.resources | length > 0
        - r_argocd_status.resources[0].status is defined
        - r_argocd_status.resources[0].status.phase is defined
        - r_argocd_status.resources[0].status.phase == 'Available'

- name: Skip GitOps Operator install - already installed
  when: gitops_operator_installed
  block:
    - name: Display skip message
      debug:
        msg: "GitOps operator already installed, skipping operator installation"

    - name: Wait for ArgoCD to be available (if exists)
      kubernetes.core.k8s_info:
        api_version: argoproj.io/v1alpha1
        kind: ArgoCD
        namespace: openshift-gitops
      register: r_argocd_ready
      retries: 30
      delay: 10
      until:
        - r_argocd_ready.resources is defined
        - r_argocd_ready.resources | length > 0
        - r_argocd_ready.resources[0].status is defined
        - r_argocd_ready.resources[0].status.phase is defined
        - r_argocd_ready.resources[0].status.phase == 'Available'
      when: argocd_exists

- name: Verify Application CRD is available
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: applications.argoproj.io
  register: r_app_crd
  retries: 30
  delay: 10
  until:
    - r_app_crd.resources is defined
    - r_app_crd.resources | length > 0

- name: Display GitOps setup complete
  debug:
    msg: "OpenShift GitOps operator and ArgoCD are ready"
