# DAYS FIX: Updated for OpenShift Logging 6.x API
# ClusterLogging is deprecated - use ClusterLogForwarder instead
apiVersion: observability.openshift.io/v1
kind: ClusterLogForwarder
metadata:
  name: collector
  namespace: openshift-logging
spec:
  managementState: Managed
  serviceAccount:
    name: collector
  # DAYS FIX: Increased collector memory to prevent OOMKilled on busy nodes
  collector:
    resources:
      limits:
        memory: 4Gi
      requests:
        memory: 256Mi
  outputs:
    - name: default-lokistack
      type: lokiStack
      lokiStack:
        target:
          name: logging-loki
          namespace: openshift-logging
        authentication:
          token:
            from: serviceAccount
      tls:
        ca:
          configMapName: openshift-service-ca.crt
          key: service-ca.crt
  pipelines:
    - name: default-logstore
      inputRefs:
        - application
        - infrastructure
      outputRefs:
        - default-lokistack
