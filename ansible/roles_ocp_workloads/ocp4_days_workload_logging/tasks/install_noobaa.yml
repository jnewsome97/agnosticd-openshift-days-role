---
# DAYS FIX: Check if ODF operator is already installed
- name: Check if ODF operator CSV already exists
  shell: |
    oc get csv -n openshift-storage 2>/dev/null | grep -i "odf-operator" | grep -i "Succeeded" || true
  register: r_odf_csv_check
  ignore_errors: true

- name: Set odf_operator_installed fact
  ansible.builtin.set_fact:
    odf_operator_installed: "{{ r_odf_csv_check.stdout | length > 0 }}"

- name: Display ODF operator status
  debug:
    msg: "ODF operator installed: {{ odf_operator_installed }}"

- name: Install OpenShift ODF Operator
  when: not odf_operator_installed
  ansible.builtin.include_role:
    name: install_operator
  vars:
    install_operator_action: install
    install_operator_name: odf-operator
    install_operator_namespace: openshift-storage
    install_operator_manage_namespaces: ["openshift-storage"]
    install_operator_channel: "stable-4.15"
    install_operator_catalog: redhat-operators
    install_operator_automatic_install_plan_approval: "{{ ocp4_workload_logging_automatic_install_plan_approval }}"
    install_operator_catalogsource_setup: "{{ ocp4_workload_logging_catalogsource_setup }}"
    install_operator_catalogsource_name: "{{ ocp4_workload_logging_redhat_catalogsource_name }}"
    install_operator_catalogsource_image: "{{ ocp4_workload_logging_redhat_catalogsource_image }}"
    install_operator_catalogsource_image_tag: "{{ ocp4_workload_logging_catalogsource_image_tag }}"

- name: Skip ODF operator install - already installed
  when: odf_operator_installed
  debug:
    msg: "ODF operator already installed, skipping"

# DAYS FIX: Ensure MCG is enabled in StorageCluster (required for NooBaa)
- name: Check if StorageCluster exists
  kubernetes.core.k8s_info:
    validate_certs: '{{ verify_tls }}'
    api_version: ocs.openshift.io/v1
    kind: StorageCluster
    namespace: openshift-storage
  register: r_storagecluster

- name: Enable MCG in StorageCluster if it exists but MCG not enabled
  when:
    - r_storagecluster.resources | length > 0
    - r_storagecluster.resources[0].spec.multiCloudGateway is not defined
  kubernetes.core.k8s:
    validate_certs: '{{ verify_tls }}'
    state: present
    api_version: ocs.openshift.io/v1
    kind: StorageCluster
    name: "{{ r_storagecluster.resources[0].metadata.name }}"
    namespace: openshift-storage
    merge_type: merge
    definition:
      spec:
        multiCloudGateway:
          reconcileStrategy: standalone

# DAYS FIX: Check for stuck NooBaa and delete if necessary
- name: Check if NooBaa exists and is stuck
  shell: |
    NOOBAA_PHASE=$(oc get noobaa noobaa -n openshift-storage -o jsonpath='{.status.phase}' 2>/dev/null || echo "NotFound")
    NOOBAA_AGE_SECONDS=$(oc get noobaa noobaa -n openshift-storage -o jsonpath='{.metadata.creationTimestamp}' 2>/dev/null | xargs -I {} date -j -f "%Y-%m-%dT%H:%M:%SZ" {} "+%s" 2>/dev/null || echo "0")
    CURRENT_TIME=$(date "+%s")
    if [ "$NOOBAA_PHASE" = "Creating" ] && [ "$NOOBAA_AGE_SECONDS" != "0" ]; then
      AGE=$((CURRENT_TIME - NOOBAA_AGE_SECONDS))
      if [ "$AGE" -gt 600 ]; then
        echo "STUCK"
      else
        echo "CREATING"
      fi
    elif [ "$NOOBAA_PHASE" = "Ready" ]; then
      echo "READY"
    else
      echo "$NOOBAA_PHASE"
    fi
  register: r_noobaa_status
  ignore_errors: true

- name: Display NooBaa status
  debug:
    msg: "NooBaa status: {{ r_noobaa_status.stdout }}"

- name: Delete stuck NooBaa instance
  when: r_noobaa_status.stdout == "STUCK"
  block:
    - name: Set cleanup policy on stuck NooBaa before deletion
      kubernetes.core.k8s:
        validate_certs: '{{ verify_tls }}'
        state: present
        api_version: noobaa.io/v1alpha1
        kind: NooBaa
        name: noobaa
        namespace: openshift-storage
        merge_type: merge
        definition:
          spec:
            cleanupPolicy:
              confirmation: noobaa
      ignore_errors: true

    - name: Delete NooBaa validating webhook to allow deletion
      shell: |
        oc delete validatingwebhookconfiguration -l app=noobaa 2>/dev/null || true
      ignore_errors: true

    - name: Delete stuck NooBaa CR
      kubernetes.core.k8s:
        validate_certs: '{{ verify_tls }}'
        state: absent
        api_version: noobaa.io/v1alpha1
        kind: NooBaa
        name: noobaa
        namespace: openshift-storage
      ignore_errors: true

    - name: Wait for NooBaa deletion
      kubernetes.core.k8s_info:
        validate_certs: '{{ verify_tls }}'
        api_version: noobaa.io/v1alpha1
        kind: NooBaa
        name: noobaa
        namespace: openshift-storage
      register: r_noobaa_deleted
      retries: 30
      delay: 10
      until: r_noobaa_deleted.resources | length == 0

    - name: NooBaa was stuck and deleted - will be recreated
      debug:
        msg: "Deleted stuck NooBaa instance, will recreate"

- name: Evaluate NooBaa Operator is ready
  kubernetes.core.k8s_info:
    validate_certs: '{{ verify_tls }}'
    api_version: apps/v1
    kind: Deployment
    name: noobaa-operator
    namespace: openshift-storage
  register: r_odf_deploy
  retries: 50
  delay: 10
  until:
    - r_odf_deploy.resources[0].status.readyReplicas is defined
    - r_odf_deploy.resources[0].status.readyReplicas == 1

- name: Evaluate NooBaa Instance
  kubernetes.core.k8s:
    validate_certs: '{{ verify_tls }}'
    state: present
    resource_definition: "{{ lookup('file', 'noobaa.yml') }}"

- name: Evaluate NooBaa instance is ready
  kubernetes.core.k8s_info:
    validate_certs: '{{ verify_tls }}'
    api_version: apps/v1
    kind: Deployment
    name: noobaa-endpoint
    namespace: openshift-storage
  register: r_noobaa_deploy
  retries: 50
  delay: 10
  until:
    - r_noobaa_deploy.resources[0].status.readyReplicas is defined
    - r_noobaa_deploy.resources[0].status.readyReplicas > 0

- name: Evaluate NooBaa BackingStore Instance
  kubernetes.core.k8s:
    validate_certs: '{{ verify_tls }}'
    state: present
    resource_definition: "{{ lookup('template', 'noobaa_backingstore.yml.j2') }}"

- name: Evaluate NooBaa BucketClass Instance
  kubernetes.core.k8s:
    validate_certs: '{{ verify_tls }}'
    state: present
    resource_definition: "{{ lookup('file', 'noobaa_bucketclass.yml') }}"

- name: Evaluate BackingStore is ready
  kubernetes.core.k8s_info:
    validate_certs: '{{ verify_tls }}'
    api_version: noobaa.io/v1alpha1
    kind: BackingStore
    name: noobaa-pv-backing-store
    namespace: openshift-storage
  register: r_backingstore
  retries: 20
  delay: 30
  until:
    - r_backingstore.resources is defined
    - r_backingstore.resources | length | int > 0
    - r_backingstore.resources[0].status is defined
    - r_backingstore.resources[0].status.conditions is defined
    - ( r_backingstore.resources[0].status | to_json | from_json |
      community.general.json_query('conditions[?type == `Available`].status') | join ) == "True"

- name: Evaluate BucketClass is ready
  kubernetes.core.k8s_info:
    validate_certs: '{{ verify_tls }}'
    api_version: noobaa.io/v1alpha1
    kind: BucketClass
    name: noobaa-default-bucket-class
    namespace: openshift-storage
  register: r_bucketclass
  retries: 100
  delay: 2
  until:
    - r_bucketclass.resources is defined
    - r_bucketclass.resources | length | int > 0
    - r_bucketclass.resources[0].status is defined
    - r_bucketclass.resources[0].status.conditions is defined
    - ( r_bucketclass.resources[0].status | to_json | from_json |
      community.general.json_query('conditions[?type == `Available`].status') | join ) == "True"
